<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ProDirt LLC Blog - App development, IT fixes, and field notes from a Virginia-based software company.">
    <link rel="canonical" href="https://prodirt-llc.github.io/blog/">
    <title>ProDirt Blog - IT Fixes & App Development Notes</title>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ProDirt LLC">
    <meta property="og:title" content="ProDirt Blog">
    <meta property="og:description" content="App development, real-world IT fixes, and field notes from a Virginia-based software company.">
    <meta property="og:url" content="https://prodirt-llc.github.io/blog/">
    <meta property="og:image" content="https://prodirt-llc.github.io/logo.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="ProDirt Blog">
    <meta name="twitter:description" content="App development, real-world IT fixes, and field notes.">
    <meta name="twitter:image" content="https://prodirt-llc.github.io/logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; background: #f5f5f5; }

        .hero {
            background: linear-gradient(135deg, #1a3a1a 0%, #2d5a2d 100%);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
            border-bottom: 3px solid #ff6b35;
        }
        .hero h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .hero p { opacity: 0.85; font-size: 1.05rem; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: white; text-decoration: none; opacity: 0.8; font-size: 0.9rem; }
        .back-link:hover { opacity: 1; }

        .container { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.5rem; }

        .post-card {
            background: white;
            border-radius: 10px;
            padding: 1.75rem 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #ff6b35;
            transition: transform 0.15s, box-shadow 0.15s;
            text-decoration: none;
            display: block;
            color: inherit;
        }
        .post-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }

        .post-meta { font-size: 0.82rem; color: #999; margin-bottom: 0.4rem; display: flex; gap: 1rem; flex-wrap: wrap; }
        .post-tag { background: #f0f7f0; color: #2d5a2d; padding: 1px 8px; border-radius: 10px; font-size: 0.78rem; font-weight: 600; }

        .post-card h2 { font-size: 1.25rem; color: #1a3a1a; margin-bottom: 0.5rem; }
        .post-card p { color: #666; font-size: 0.95rem; line-height: 1.6; }

        .read-more { display: inline-block; margin-top: 0.75rem; color: #ff6b35; font-size: 0.9rem; font-weight: 600; }

        #loading { text-align: center; color: #999; padding: 3rem 0; font-style: italic; }
        #error { text-align: center; color: #c0392b; padding: 3rem 0; }

        .empty { text-align: center; color: #aaa; padding: 4rem 0; font-style: italic; }

        footer { background: #2d3748; color: white; padding: 2rem; text-align: center; margin-top: 4rem; }
        footer a { color: #ff6b35; text-decoration: none; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="hero">
    <a href="https://prodirt-llc.github.io/" class="back-link">? Back to ProDirt Apps</a>
    <h1>ProDirt Blog</h1>
    <p>App development, IT fixes, and field notes — undocumented problems solved.</p>
</div>

<div class="container">
    <div id="loading">Loading posts...</div>
    <div id="error" style="display:none;">Could not load posts. <a href="posts.json">Check posts.json</a></div>
    <div id="posts"></div>
</div>

<footer>
    <p>© 2026 ProDirt LLC. All rights reserved.</p>
    <p style="margin-top: 0.75rem;">
        <a href="https://prodirt-llc.github.io/">Apps</a> |
        <a href="mailto:contact.prodirt@gmail.com">Contact</a>
    </p>
</footer>

<script>
    fetch('posts.json')
        .then(r => {
            if (!r.ok) throw new Error('fetch failed');
            return r.json();
        })
        .then(posts => {
            document.getElementById('loading').style.display = 'none';
            const container = document.getElementById('posts');

            if (!posts.length) {
                container.innerHTML = '<p class="empty">No posts yet — check back soon.</p>';
                return;
            }

            // Newest first
            posts.sort((a, b) => new Date(b.date) - new Date(a.date));

            container.innerHTML = posts.map(p => `
                <a class="post-card" href="posts/${p.file}">
                    <div class="post-meta">
                        <span>${formatDate(p.date)}</span>
                        ${p.tag ? `<span class="post-tag">${p.tag}</span>` : ''}
                    </div>
                    <h2>${p.title}</h2>
                    <p>${p.description}</p>
                    <span class="read-more">Read more →</span>
                </a>
            `).join('');
        })
        .catch(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        });

    function formatDate(str) {
        const d = new Date(str + 'T12:00:00');
        return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }
</script>
<script src="/nav.js" defer></script>

</body>
</html>
